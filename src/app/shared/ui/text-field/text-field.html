<div class="field">
  <label>
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true">*</span>
    }
  </label>

  <input
    pInputText
    [type]="type()"
    [placeholder]="placeholder()"
    [required]="required()"
    [value]="value()"
    (input)="valueChange.emit($any($event.target).value)"
  />
</div>
